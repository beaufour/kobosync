[project]
name = "kobosync"
version = "0.1.0"
description = "Sync Kobo reading history and status with Hardcover.app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.8",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
]

[project.scripts]
kobosync = "kobosync.cli:cli"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.7",
    "ty>=0.0.24",
]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]


[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kobosync"]
